name: stellarium-daily
base: core26
summary: Free, open source planetarium software
description: |
  Stellarium renders 3D photo-realistic skies in real-time. With Stellarium, you
  really see what you can see with your eyes, binoculars or a small telescope.
adopt-info: stellarium
donation: https://opencollective.com/stellarium/donate
issues: https://github.com/Stellarium/stellarium/issues 
website: https://stellarium.org
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: amd64
    build-for: amd64
  arm64:
    build-on: arm64
    build-for: arm64
    
compression: lzo

apps:
  stellarium:
    command-chain:
      - bin/gpu-2604-wrapper
    command: bin/desktop-launch $SNAP/usr/bin/stellarium
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - browser-support
      - x11
      - unity7
      - gsettings
      - opengl
      - network
      - network-bind
      - audio-playback
      - audio-record
      - home
      - raw-usb
    common-id: org.stellarium.Stellarium
    
    environment:
      HOME: "$SNAP_USER_COMMON"
      LD_LIBRARY_PATH: $LD_LIBRARY_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio
      QT_PLUGIN_PATH: $QT_PLUGIN_PATH:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/qt6/plugins
      QTWEBENGINEPROCESS_PATH: $SNAP/usr/lib/qt6/libexec/QtWebEngineProcess
      QTWEBENGINE_DISABLE_SANDBOX: 1

layout:
  /usr/share/qt6:
    bind: $SNAP/usr/share/qt6
  /usr/share/X11/XErrorDB:
    symlink: $SNAP/gpu-2604/usr/share/X11/XErrorDB
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libproxy

package-repositories:
  - type: apt
    ppa: stellarium/stellarium-releases

parts:
  stellarium:
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX:PATH=/usr
    source: https://github.com/Stellarium/stellarium.git
    source-type: git
    parse-info: [usr/share/metainfo/org.stellarium.Stellarium.appdata.xml]
    after: [desktop-stellarium]
    override-pull: |
      last_committed_tag="$(git ls-remote --tags https://github.com/Stellarium/stellarium.git | grep -v {} | awk -F/ '{ print $3 }' | sort -V |tail -n 1)"
      last_released_tag="$(snap info stellarium-daily | awk '$1 == "latest/beta:" { print $2 }')"
      
      if [ "${last_committed_tag}" != "${last_released_tag}" ]; then
        git clone -b "${last_committed_tag}" --depth 1 https://github.com/Stellarium/stellarium.git $CRAFT_PART_SRC
      else
        craftctl default
      fi
      sed -i.bak -e 's|Icon=stellarium|Icon=/usr/share/icons/hicolor/64x64/apps/stellarium.png|g' data/org.stellarium.Stellarium.desktop
      craftctl set version=$(git describe --tags) 
    override-build: |
      if [ "$(arch)" = "aarch64" ]; then
        cmake $CRAFT_PART_SRC -DENABLE_SHOWMYSKY=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$CRAFT_PART_INSTALL/usr
        make
        make install
      else
        craftctl default
      fi
      
    build-packages:
      - build-essential
      - zlib1g-dev
      - libgl1-mesa-dev
      - libdrm-dev
      - gettext
      - doxygen
      - graphviz
      - libgps-dev
      - libnlopt-cxx-dev
      - libexiv2-dev
      - libtbb-dev
      - libxkbcommon-x11-dev
      - qt6-base-dev
      - qt6-base-private-dev
      - qt6-multimedia-dev
      - qt6-positioning-dev
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - qt6-base-dev-tools
      - qt6-qpa-plugins
      - qt6-image-formats-plugins
      - qt6-speech-dev
      - qt6-svg-dev
      - qt6-l10n-tools
      - qt6-webengine-dev
      - qt6-webengine-dev-tools
      - qt6-charts-dev
      - libqt6positioning6-plugins
      - qt6-serialport-dev
      - libfast-float-dev
      
    stage-packages:
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-pulseaudio
      - gstreamer1.0-libav
      - gstreamer1.0-vaapi
      - libqt6multimedia6
      - libqt6multimediawidgets6
      - libqt6opengl6
      - libqt6openglwidgets6
      - libqt6positioning6
      - libqt6printsupport6
      - libqt6serialport6
      - libqt6charts6
      - libqt6core6t64
      - libqt6dbus6
      - libqt6network6
      - libqt6gui6
      - qt6-image-formats-plugins
      - libqt6svg6
      - libqt6svgwidgets6
      - libqt6qml6
      - libqt6qmlmeta6
      - libqt6qmlmodels6
      - libqt6qmlworkerscript6
      - libqt6quick6
      - libqt6quickwidgets6
      - libqt6webchannel6
      - libqt6webenginecore6-bin
      - libqt6webenginecore6
      - libqt6webengine6-data
      - libqt6webenginewidgets6
      - libqt6widgets6
      - libqt6concurrent6
      - qt6-gtk-platformtheme
      - qt6-translations-l10n
      - qt6-qpa-plugins
      - qt6-svg-plugins
      - qt6-wayland
      - libqt6waylandclient6
      - libqt6waylandcompositor6
      - libqt6wlshellintegration6
      - libgps32
      - libopengl0
      - libqt6texttospeech6
      - libts0t64
      - libnlopt-cxx0
      - libexiv2-28
      - libmd4c0
      - libmd4c-html0
      - libb2-1
      - libminizip1t64
      - sse3-support
      - calcmysky
      - libtbb12
      - libpipewire-0.3-0t64
      
  cleanup:
    after: [desktop-stellarium, stellarium, gpu-2604]
    plugin: nil
    build-snaps:
      - core26
    override-prime: |
      set -eux
      for CRUFT in bug lintian man; do
        rm -rf $CRAFT_PRIME/usr/share/$CRUFT
      done
      for snap in "core24"; do
        cd "/snap/$snap/current" && find . -type f,l -exec rm -f "$CRAFT_PRIME/{}" \;
      done
      find $CRAFT_PRIME/usr/share/doc/ -type f -not -name 'copyright' -delete
      find $CRAFT_PRIME/usr/share -type d -empty -delete
      
  desktop-stellarium:
    source: https://github.com/t4saha/snapcraft-desktop-helpers-Qt6.git
    source-subdir: qt
    source-depth: 1
    plugin: make
    make-parameters: ["FLAVOR=qt6"]
    build-packages:
      - build-essential
      - qt6-base-dev
      - dpkg-dev
      - software-properties-common
    stage-packages:
      - libxkbcommon0
      - xkb-data
      - xdg-user-dirs
      - libgtk-3-common
      - libgtk-3-0t64
      - gsettings-desktop-schemas

  gpu-2604:
    after: [desktop-stellarium, stellarium]
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2604-cleanup mesa-2604
    prime:
      - bin/gpu-2604-wrapper

plugs:
  gtk-3-themes:
    interface: content
    target: $SNAP/data-dir/themes
    default-provider: gtk-common-themes
  icon-themes:
    interface: content
    target: $SNAP/data-dir/icons
    default-provider: gtk-common-themes
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604
